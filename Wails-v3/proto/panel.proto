syntax = "proto3";

package panel;

option go_package = "hermes/proto/gen/panelpb;panelpb";

// Panel ↔ Erlang 通道协议 (Wails ↔ Agent-brains panel_server)。
//
// 帧格式: 4 字节大端长度前缀 + PanelFrame 的 Protobuf 二进制。
// 通信模型:
//   - client (Wails brain.Bridge) 发 PanelFrame{request: ...} 或 PanelFrame{exec_result: ...}
//   - server (Erlang panel_server) 回 PanelFrame{response: ...}、PanelFrame{stream: ...}
//     或 Phase B: PanelFrame{exec: ...} (经 panel 连接进程内执行 hermes AgentRequest)
//
// 设计原则: 无 method 字符串 dispatch 歧义; args/result 用 bytes 嵌套编码,
// 让 panel_server 按 method 字符串选对应 Args/Result message 解码/编码。

// 顶层帧包装。
message PanelFrame {
  oneof payload {
    PanelRequest request = 1;       // client -> server
    PanelResponse response = 2;     // server -> client (一次性响应)
    PanelStream stream = 3;         // server -> client (流式 push, 仅 send 方法)
    PanelExec exec = 4;             // server -> client (Phase B: 进程内 LLM/工具)
    PanelExecResult exec_result = 5; // client -> server (Phase B: exec 响应帧)
  }
}

// Phase B: Erlang bridge_manager 经 panel 连接让 Wails Go 进程内执行 hermes AgentRequest。
message PanelExec {
  uint64 id = 1;
  bytes agent_request = 2;  // hermes.AgentRequest protobuf
}

message PanelExecResult {
  uint64 id = 1;
  bytes agent_response = 2;  // hermes.AgentResponse protobuf (流式时多帧)
  string error = 3;          // 非空表示失败
  bool terminal = 4;         // true=本次 exec 结束
}

// 一次性请求。
message PanelRequest {
  uint64 id = 1;          // 请求 ID (用于 response 路由匹配, stream 不复用此 id)
  string method = 2;      // start_session / send / list_tools / list_capabilities / list_pending_approvals / approve / brain_status / get_history / delete_session / stop / list_providers / upsert_provider / delete_provider / set_default_provider / test_provider / get_risk_policies / set_risk_policy / set_session_provider / cancel_execution / list_memories / add_memory / delete_memory / clear_memories
  bytes args_bytes = 3;   // 方法对应 Args message 的 Protobuf 编码
}

// 一次性响应 (与 PanelRequest.id 一一对应)。
message PanelResponse {
  uint64 id = 1;
  oneof payload {
    bytes result_bytes = 2;  // 方法对应 Result message 的 Protobuf 编码
    string error = 3;        // 错误描述 (非空表示失败)
  }
}

// 流式 push 帧 (server 在 send 方法的原连接上连续推)。
message PanelStream {
  string stream_id = 1;       // 关联 send 返回的 stream_id
  oneof payload {
    LlmChunk chunk = 2;       // LLM 流式增量 (非终态)
    ToolEvent tool_event = 3; // 工具事件 (开始/结束, 非终态)
    FinalAnswer final = 4;    // 终态: 最终答案就绪
    StreamError error = 5;    // 终态: 流式错误
    ApprovalRequired approval_required = 6; // 非终态: 高风险能力需用户审批 (EXEC-P0-005)
    PlanGenerated plan_generated = 7;       // 非终态: Planner生成执行计划 (EXEC-P2-001)
    PlanStepUpdate plan_step_update = 8;    // 非终态: 计划步骤状态更新 (EXEC-P2-001)
  }
}

// 审批请求 (server -> client): 告知前端某个 tool_call 需要用户授权。
// 前端弹窗, 用户选择后调 PanelRequest{method="approve", args=ApproveArgs{req_id, allow}}。
message ApprovalRequired {
  string req_id = 1;           // 审批请求 ID (approve RPC 的幂等键, 与 ToolExecRequest.req_id 一致)
  string session_id = 2;       // 会话 ID
  string tool_call_id = 3;     // 对应的 tool_call.id
  string tool_name = 4;        // 工具名
  string arguments_json = 5;   // 工具参数 (JSON 字符串, 供前端展示)
  string risk_level = 6;       // 风险级别 (review/dangerous/high/critical)
  int32  expire_ms = 7;        // 过期时间 (毫秒, 默认 300000=5min)
}

// 审批队列条目 (server -> client): 用于审批中心拉取全局待审批列表。
message PendingApprovalEntry {
  string req_id = 1;
  string session_id = 2;
  string tool_call_id = 3;
  string tool_name = 4;
  string arguments_json = 5;
  string risk_level = 6;
  int32 expire_ms = 7;
  int64 registered_at = 8;
}

// ============================================================
// EXEC-P2-001: Planner 计划相关消息
// ============================================================

message PlanStep {
  int32 index = 1;             // 步骤序号 (从1开始)
  string description = 2;      // 步骤描述
  string tool_hint = 3;        // 预计调用的工具名 (空表示无特定工具)
  string risk_level = 4;       // 风险等级 (safe/review/dangerous)
}

message PlanGenerated {
  string goal = 1;             // 目标描述
  repeated PlanStep steps = 2; // 步骤列表
  repeated string warnings = 3; // 警告信息
  repeated string suggestions = 4; // 建议
}

enum PlanStepStatus {
  PLAN_STEP_PENDING = 0;   // 待执行
  PLAN_STEP_RUNNING = 1;   // 执行中
  PLAN_STEP_DONE = 2;      // 完成
  PLAN_STEP_FAILED = 3;    // 失败
  PLAN_STEP_SKIPPED = 4;   // 跳过
}

message PlanStepUpdate {
  int32 step_index = 1;         // 步骤序号
  PlanStepStatus status = 2;    // 新状态
  string result_summary = 3;    // 结果摘要 (完成/失败时填)
}

// ============================================================
// EXEC-P2-003: Provider 配置相关消息
// ============================================================

message ProviderConfig {
  string id = 1;                // Provider唯一标识
  string name = 2;              // 显示名称
  string api_base = 3;          // API Base URL
  string api_key = 4;           // API Key (返回时掩码)
  repeated string models = 5;   // 支持的模型列表
  bool enabled = 6;             // 是否启用
  bool is_default = 7;          // 是否为默认Provider
  int64 latency_ms = 8;         // 测试连接延迟 (仅test_provider时填充)
}

message ModelRoute {
  string model = 1;
  string provider_id = 2;
  string provider_name = 3;
}

message RiskPolicy {
  string risk_level = 1;        // safe/review/dangerous
  string action = 2;            // allow/approve/deny
}

message ListProvidersResult {
  repeated ProviderConfig providers = 1;
}

message UpsertProviderArgs {
  ProviderConfig provider = 1;
}

message UpsertProviderResult {
  bool ok = 1;
  string id = 2;
}

message DeleteProviderArgs {
  string provider_id = 1;
}

message DeleteProviderResult {
  bool ok = 1;
}

message SetDefaultProviderArgs {
  string provider_id = 1;
}

message SetDefaultProviderResult {
  bool ok = 1;
}

message TestProviderArgs {
  ProviderConfig provider = 1;
}

message TestProviderResult {
  bool ok = 1;
  int64 latency_ms = 2;
  string error = 3;
}

message GetRiskPoliciesResult {
  repeated RiskPolicy policies = 1;
}

message SetRiskPolicyArgs {
  string risk_level = 1;
  string action = 2;
}

message SetRiskPolicyResult {
  bool ok = 1;
}

message SetSessionProviderArgs {
  string session_id = 1;
  string provider_id = 2;
}

message SetSessionProviderResult {
  bool ok = 1;
}

// ============================================================
// EXEC-P2-002: 分层记忆相关消息
// ============================================================

enum MemoryTier {
  MEMORY_TIER_UNSPECIFIED = 0;
  MEMORY_TIER_FACTS = 1;
  MEMORY_TIER_PREFERENCES = 2;
  MEMORY_TIER_WORKSPACE = 3;
}

message MemoryEntry {
  string key = 1;               // 记忆唯一键 (内容哈希)
  MemoryTier tier = 2;          // 记忆层级
  string content = 3;           // 记忆内容
  string source = 4;            // 来源: auto(LLM抽取)/manual(手动/工具写入)
  int64 created_at = 5;         // 创建时间戳 (毫秒)
  string session_id = 6;        // 所属会话ID (global表示全局记忆)
}

message ListMemoriesArgs {
  string session_id = 1;        // 会话ID (空则当前全局)
  MemoryTier tier = 2;          // 层级 (0=全部)
}

message ListMemoriesResult {
  repeated MemoryEntry memories = 1;
}

message AddMemoryArgs {
  string session_id = 1;        // 会话ID (空则global)
  MemoryTier tier = 2;          // 层级
  string content = 3;           // 记忆内容
}

message AddMemoryResult {
  bool ok = 1;
  string key = 2;
}

message DeleteMemoryArgs {
  string session_id = 1;
  MemoryTier tier = 2;
  string key = 3;
}

message DeleteMemoryResult {
  bool ok = 1;
}

message ClearMemoriesArgs {
  string session_id = 1;        // 会话ID (空则当前会话)
  MemoryTier tier = 2;          // 层级 (0=全部三层)
}

message ClearMemoriesResult {
  bool ok = 1;
  int32 count = 2;              // 删除条数
}

// ============================================================
// EXEC-P2-003: 取消执行
// ============================================================

message CancelExecutionArgs {
  string session_id = 1;
}

message CancelExecutionResult {
  bool ok = 1;
}

// ============================================================
// LLM 流式 chunk
// ============================================================

message LlmChunk {
  string content = 1;            // 增量正文 (与上一段拼接)
  string reasoning_content = 2;  // 增量推理过程 (v4-pro 等推理模型)
}

message JsonField {
  string key = 1;
  JsonValue value = 2;
}

message ToolParameter {
  string name = 1;
  string type = 2;
  string description = 3;
  bool required = 4;
}

message ToolParameters {
  string type = 1;
  repeated ToolParameter properties = 2;
}

message JsonObject {
  repeated JsonField fields = 1;
}

message JsonArray {
  repeated JsonValue items = 1;
}

message JsonValue {
  oneof kind {
    string string_value = 1;
    double number_value = 2;
    bool bool_value = 3;
    JsonObject object_value = 4;
    JsonArray array_value = 5;
    bool null_value = 6;  // true 表示 JSON null
  }
}

message ToolFunction {
  string name = 1;
  JsonValue arguments = 2;
}

message ToolCall {
  string id = 1;
  string type = 2;
  ToolFunction function = 3;
}

// 工具事件: 告知前端当前轮工具执行进度。
message ToolEvent {
  string tool_call_id = 1;
  string name = 2;
  JsonValue arguments = 3;
  JsonValue result = 4;   // 完成时填
  string error = 5;          // 失败时填
  bool finished = 6;         // true=已结束 (有 result 或 error), false=已开始
}

// 最终答案 (ReAct 循环结束, FSM 回到 idle)。
message FinalAnswer {
  string content = 1;
  int32 prompt_tokens = 2;
  int32 completion_tokens = 3;
  int32 loop_count = 4;     // 本次 ReAct 总循环数
}

// 流式错误 (终态): 告知前端流被异常中断。
message StreamError {
  string message = 1;
}

// ---- 方法参数 ----
message StartSessionArgs {
  string system_prompt = 1;
  string model = 2;       // 空则 Erlang 侧 default_model
  string api_key = 3;     // 空则 api-key.json / app env
  string api_base = 4;    // 空则 app env (如 https://api.deepseek.com)
}
message SendArgs { string session_id = 1; string message = 2; }
message ApproveArgs { string req_id = 1; bool allow = 2; }
message BrainStatusArgs { string session_id = 1; }
message GetHistoryArgs { string session_id = 1; }
message DeleteSessionArgs { string session_id = 1; }

// ---- 方法结果 ----
message StartSessionResult { string session_id = 1; }
message SendResult { string stream_id = 1; }

message ListToolsResult {
  repeated ToolDesc tools = 1;
}
message ToolDesc {
  string name = 1;
  string description = 2;
  bytes parameters_pb = 3;
}

message ListCapabilitiesResult {
  repeated CapabilityDesc capabilities = 1;
}

message ListPendingApprovalsResult {
  repeated PendingApprovalEntry approvals = 1;
}

message CapabilityDesc {
  string name = 1;
  string kind = 2;
  string source = 3;
  string version = 4;
  string description = 5;
  bytes input_schema_pb = 6;
  bytes output_schema_pb = 7;
  bool streaming = 8;
  string risk_level = 9;
  string cost_hint = 10;
  repeated string tags = 11;
}

message DebugCapabilityArgs {
  string capability_name = 1;
  string arguments_json = 2;
  uint32 timeout_ms = 3;
}

message DebugCapabilityResult {
  string capability_name = 1;
  string result_json = 2;
  string error = 3;
}

message ApproveResult { bool ok = 1; }

message BrainStatusResult {
  string state = 1;
  int32 loop_count = 2;
  int32 max_loops = 3;
  int32 history_len = 4;
}

message HistoryEntry {
  string role = 1;
  string content = 2;
  repeated ToolCall tool_calls = 3;
  string tool_call_id = 4;     // role=tool 时填
}

message GetHistoryResult {
  repeated HistoryEntry messages = 1;
}

message StopResult { bool ok = 1; }
message DeleteSessionResult { bool ok = 1; }
